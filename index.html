<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>bibliograma</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Base colors */
      --brown: #663A24;
      --teal:  #285666;
      --green: #3C6655;
      --cream: #EEE0D9;
      --sky:   #C3DDE6;

      /* Light Theme */
      --bg: #EEE0D9;
      --surface: #F8F1ED;
      --ink: #2A1C14;
      --muted: #6d5a50;
      --line: #d9c8bf;
      --accent: #285666;
      --on-accent: #EEE0D9;
      --chip: #C3DDE6;
      --star: #663A24;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14232a;
        --surface: #1c323b;
        --ink: #EEE0D9;
        --muted: #a9b9bf;
        --line: #2d4752;
        --accent: #C3DDE6;
        --on-accent: #14232a;
        --chip: #285666;
        --star: #e3b99f;
      }
    }

    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background-color: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", Helvetica Neue, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, h5, h6 {
      margin: 0;
      font-family: "Bricolage Grotesque", Helvetica Neue, Arial, sans-serif;
      letter-spacing: -0.02em;
    }
    
    p { margin: 0; }
    ul { margin: 0; padding: 0; list-style: none; }
    button, input, textarea {
      font-family: inherit;
      color: inherit;
      border: none;
      background: none;
      padding: 0;
    }
    button {
      cursor: pointer;
    }
    
    :focus-visible {
      outline: 3px solid var(--green);
      outline-offset: 2px;
      border-radius: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Layout */
    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-area svg {
      width: 40px;
      height: 40px;
    }

    .logo-area h1 {
      font-weight: 700;
      font-size: 24px;
      text-transform: lowercase;
    }

    .btn-add {
      background-color: var(--accent);
      color: var(--on-accent);
      font-weight: 700;
      padding: 11px 20px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    
    .btn-add:hover {
      opacity: 0.9;
    }

    .btn-add .text {
      display: inline;
    }

    @media (max-width: 639px) {
      .btn-add {
        padding: 11px 16px;
      }
      .btn-add .text {
        display: none;
      }
    }

    /* Summary Grid */
    .summary-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 12px;
    }

    .card {
      background-color: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .card-value {
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 700;
      font-size: 40px;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .card-last-book {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
    }

    /* Goal Card specific */
    .card-goal {
      background-color: var(--teal);
      color: var(--cream);
      border-color: transparent;
    }
    
    .card-goal .card-label {
      color: var(--sky);
    }
    
    .card-goal .card-value {
      margin-bottom: 16px;
    }

    .progress-track {
      height: 8px;
      background-color: rgba(195, 221, 230, 0.25);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--sky);
      border-radius: 4px;
      transition: width 0.6s ease-out;
      width: 0%;
    }

    @media (max-width: 639px) {
      .summary-grid {
        grid-template-columns: 1fr 1fr;
      }
      .card-goal {
        grid-column: 1 / -1;
      }
    }

    /* Tools */
    .tools {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      background-color: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 20px;
    }
    
    .search-input::placeholder {
      color: var(--muted);
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 14px;
      transition: all 0.2s;
    }

    .chip[aria-pressed="true"] {
      background-color: var(--chip);
      border-color: var(--chip);
      font-weight: 700;
    }

    /* List */
    .list-header {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .book-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .book-row {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 20px;
      background-color: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      align-items: start;
    }

    .cover {
      width: 64px;
      height: 92px;
      border-radius: 4px 8px 8px 4px;
      box-shadow: inset 6px 0 0 rgba(0, 0, 0, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 700;
      font-size: 22px;
    }

    .cover-0 { background-color: var(--brown); color: var(--cream); }
    .cover-1 { background-color: var(--teal); color: var(--cream); }
    .cover-2 { background-color: var(--green); color: var(--cream); }
    .cover-3 { background-color: var(--sky); color: var(--teal); }

    .book-content {
      display: flex;
      flex-direction: column;
    }

    .book-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .book-author {
      font-size: 14px;
      color: var(--muted);
    }

    .book-comment {
      font-size: 15px;
      max-width: 56ch;
      margin-top: 8px;
    }

    .book-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .stars {
      display: flex;
      gap: 2px;
    }

    .star {
      width: 16px;
      height: 16px;
      fill: var(--star);
    }

    .star.empty {
      opacity: 0.25;
    }

    .book-date {
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 639px) {
      .book-row {
        grid-template-columns: 52px 1fr;
        gap: 14px;
        padding: 14px;
      }
      .cover {
        width: 52px;
        height: 76px;
        font-size: 18px;
      }
      .book-meta {
        grid-column: 2;
        align-items: flex-start;
        flex-direction: row;
        gap: 12px;
        margin-top: 6px;
        align-items: center;
      }
      .book-comment {
        margin-bottom: 6px;
      }
    }

    /* Empty State */
    .empty-state {
      border: 2px dashed var(--line);
      border-radius: 18px;
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      display: none;
    }

    /* Modal */
    dialog {
      border: none;
      border-radius: 22px;
      background-color: var(--surface);
      color: var(--ink);
      width: min(480px, 100% - 24px);
      padding: 24px;
      margin: auto;
    }

    dialog::backdrop {
      background-color: rgba(20, 35, 42, 0.55);
      backdrop-filter: blur(2px);
    }

    .modal-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-title {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 500;
    }

    .form-input {
      background-color: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      width: 100%;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    
    @media (max-width: 480px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    .star-rating {
      display: flex;
      gap: 4px;
    }

    .star-input {
      width: 30px;
      height: 30px;
      cursor: pointer;
      fill: var(--line);
      transition: fill 0.2s;
    }

    .star-input.active {
      fill: var(--star);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 8px;
    }

    .btn-ghost {
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid var(--line);
      font-weight: 500;
    }

    .btn-primary {
      padding: 10px 20px;
      border-radius: 12px;
      background-color: var(--accent);
      color: var(--on-accent);
      font-weight: 700;
    }
    
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="logo-area">
        <svg viewBox="0 0 48 48" role="img" aria-label="Logo de bibliograma">
          <rect width="48" height="48" rx="13" fill="#285666"/>
          <rect x="9" y="22" width="8" height="17" rx="1.5" fill="#C3DDE6"/>
          <rect x="20" y="14" width="8" height="25" rx="1.5" fill="#EEE0D9"/>
          <rect x="31" y="8" width="8" height="31" rx="1.5" fill="#3C6655" stroke="#C3DDE6" stroke-width="1.5"/>
          <path d="M11 27h4M22 19h4M33 13h4" stroke="#285666" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M7 42h34" stroke="#663A24" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <h1>bibliograma</h1>
      </div>
      <button class="btn-add" id="btn-open-modal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span class="text">Añadir lectura</span>
      </button>
    </header>

    <section class="summary-grid">
      <div class="card card-goal">
        <div class="card-label">Meta 2026</div>
        <div class="card-value" id="goal-text">0 de 24 libros</div>
        <div class="progress-track">
          <div class="progress-fill" id="goal-progress"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-label">Nota media</div>
        <div class="card-value" id="avg-rating">–</div>
      </div>
      <div class="card">
        <div class="card-label">Último libro</div>
        <div class="card-last-book" id="last-book-title">–</div>
      </div>
    </section>

    <section class="tools">
      <input type="text" class="search-input" id="search-input" placeholder="Buscar por título o autor">
      <div class="chips">
        <button class="chip" aria-pressed="true" data-filter="all">Todos</button>
        <button class="chip" aria-pressed="false" data-filter="5">5 estrellas</button>
        <button class="chip" aria-pressed="false" data-filter="4">4 o más</button>
      </div>
    </section>

    <section>
      <h2 class="list-header">Leídos</h2>
      <ul class="book-list" id="book-list"></ul>
      <div class="empty-state" id="empty-state">
        No hay lecturas con este filtro. Prueba otra búsqueda o añade un libro nuevo.
      </div>
    </section>
  </div>

  <dialog id="modal-add">
    <form method="dialog" id="form-add" class="modal-content">
      <h2 class="modal-title">Nueva lectura</h2>
      
      <div class="form-group">
        <label for="input-title">Título</label>
        <input type="text" id="input-title" class="form-input" placeholder="Ej. Pedro Páramo">
      </div>
      
      <div class="form-group">
        <label for="input-author">Autor</label>
        <input type="text" id="input-author" class="form-input" placeholder="Ej. Juan Rulfo">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Puntuación</label>
          <div class="star-rating" id="input-rating" role="radiogroup">
            <svg class="star-input active" role="radio" aria-checked="true" tabindex="0" data-val="1" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <svg class="star-input active" role="radio" aria-checked="true" tabindex="0" data-val="2" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <svg class="star-input active" role="radio" aria-checked="true" tabindex="0" data-val="3" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <svg class="star-input" role="radio" aria-checked="false" tabindex="0" data-val="4" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <svg class="star-input" role="radio" aria-checked="false" tabindex="0" data-val="5" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          </div>
        </div>
        <div class="form-group">
          <label for="input-date">Fecha de fin</label>
          <input type="date" id="input-date" class="form-input">
        </div>
      </div>

      <div class="form-group">
        <label for="input-comment">Comentario</label>
        <textarea id="input-comment" class="form-input" rows="3" placeholder="¿Qué te ha parecido?"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="btn-cancel">Cancelar</button>
        <button type="submit" class="btn-primary" id="btn-save">Guardar lectura</button>
      </div>
    </form>
  </dialog>

  <script>
    // State
    const initialData = [
      { t: "Cien años de soledad", a: "Gabriel García Márquez", r: 5, d: "2026-09-28", c: "Me perdí en el árbol genealógico y no quise salir. Final redondo." },
      { t: "La sombra del viento", a: "Carlos Ruiz Zafón", r: 4, d: "2026-08-30", c: "Barcelona como personaje. Se alarga un poco en el último tercio." },
      { t: "Pedro Páramo", a: "Juan Rulfo", r: 5, d: "2026-07-19", c: "Corto y hondo. Lo releeré pronto para pillar lo que se me escapó." },
      { t: "Crónica de una muerte anunciada", a: "Gabriel García Márquez", r: 4, d: "2026-06-02", c: "Saber el final y seguir leyendo con el corazón en un puño." },
      { t: "El nombre de la rosa", a: "Umberto Eco", r: 3, d: "2026-04-11", c: "Brillante, pero denso. Las primeras cien páginas cuestan." }
    ];
    let books = [...initialData];
    let filterMode = 'all'; // all, 5, 4
    let searchQuery = '';
    let selectedRating = 3;

    const ANNUAL_GOAL = 24;

    // Elements
    const listEl = document.getElementById('book-list');
    const emptyEl = document.getElementById('empty-state');
    const goalText = document.getElementById('goal-text');
    const goalProgress = document.getElementById('goal-progress');
    const avgRatingEl = document.getElementById('avg-rating');
    const lastBookEl = document.getElementById('last-book-title');
    
    const searchInput = document.getElementById('search-input');
    const filterChips = document.querySelectorAll('.chip');
    
    const modal = document.getElementById('modal-add');
    const btnOpenModal = document.getElementById('btn-open-modal');
    const btnCancel = document.getElementById('btn-cancel');
    const formAdd = document.getElementById('form-add');
    
    const starInputs = document.querySelectorAll('.star-input');

    // Init
    function init() {
      renderSummary();
      renderList();
      setupListeners();
      document.getElementById('input-date').valueAsDate = new Date();
    }

    // Render logic
    function getFilteredBooks() {
      return books.filter(b => {
        const matchesSearch = (b.t.toLowerCase().includes(searchQuery) || b.a.toLowerCase().includes(searchQuery));
        const matchesFilter = filterMode === 'all' ? true : 
                              filterMode === '5' ? b.r === 5 : 
                              filterMode === '4' ? b.r >= 4 : true;
        return matchesSearch && matchesFilter;
      });
    }

    function renderSummary() {
      // Goal
      const count = books.length;
      goalText.textContent = `${count} de ${ANNUAL_GOAL} libros`;
      const pct = Math.min(100, Math.round((count / ANNUAL_GOAL) * 100));
      goalProgress.style.width = `${pct}%`;

      // Avg Rating
      if (count === 0) {
        avgRatingEl.textContent = '–';
        lastBookEl.textContent = '–';
      } else {
        const total = books.reduce((acc, b) => acc + b.r, 0);
        avgRatingEl.textContent = (total / count).toFixed(1);
        
        // Last book
        const sorted = [...books].sort((a, b) => new Date(b.d) - new Date(a.d));
        lastBookEl.textContent = sorted[0].t;
      }
    }

    function renderList() {
      const filtered = getFilteredBooks();
      listEl.innerHTML = '';
      
      if (filtered.length === 0) {
        listEl.style.display = 'none';
        emptyEl.style.display = 'block';
        return;
      }
      
      listEl.style.display = 'flex';
      emptyEl.style.display = 'none';

      filtered.forEach((book, idx) => {
        const li = document.createElement('li');
        li.className = 'book-row';
        
        const coverIdx = idx % 4;
        const coverLetters = book.t.substring(0, 2);
        
        const formatter = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
        const dateStr = formatter.format(new Date(book.d));

        let starsHtml = '';
        for (let i = 1; i <= 5; i++) {
          const c = i <= book.r ? 'star' : 'star empty';
          starsHtml += `<svg class="${c}" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`;
        }

        const commentHtml = book.c ? `<p class="book-comment"></p>` : '';

        li.innerHTML = `
          <div class="cover cover-${coverIdx}"></div>
          <div class="book-content">
            <h3 class="book-title"></h3>
            <span class="book-author"></span>
            ${commentHtml}
          </div>
          <div class="book-meta">
            <div class="stars">${starsHtml}</div>
            <span class="book-date">Terminado el ${dateStr}</span>
          </div>
        `;

        li.querySelector('.cover').textContent = coverLetters;
        li.querySelector('.book-title').textContent = book.t;
        li.querySelector('.book-author').textContent = book.a;
        if (book.c) li.querySelector('.book-comment').textContent = book.c;

        listEl.appendChild(li);
      });
    }

    // Listeners
    function setupListeners() {
      // Search
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase();
        renderList();
      });

      // Filters
      filterChips.forEach(chip => {
        chip.addEventListener('click', () => {
          filterChips.forEach(c => c.setAttribute('aria-pressed', 'false'));
          chip.setAttribute('aria-pressed', 'true');
          filterMode = chip.dataset.filter;
          renderList();
        });
      });

      // Modal
      btnOpenModal.addEventListener('click', () => {
        modal.showModal();
        setTimeout(() => document.getElementById('input-title').focus(), 50);
      });

      btnCancel.addEventListener('click', () => {
        modal.close();
      });

      // Rating selector
      starInputs.forEach(star => {
        star.addEventListener('click', () => setRating(parseInt(star.dataset.val)));
        star.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            setRating(parseInt(star.dataset.val));
          }
        });
      });

      // Form submit
      formAdd.addEventListener('submit', (e) => {
        e.preventDefault();
        const t = document.getElementById('input-title').value.trim();
        if (!t) {
          document.getElementById('input-title').focus();
          return;
        }

        const a = document.getElementById('input-author').value.trim() || "Autor desconocido";
        const c = document.getElementById('input-comment').value.trim();
        const d = document.getElementById('input-date').value || new Date().toISOString().substring(0, 10);

        const newBook = { t, a, r: selectedRating, d, c };
        books.unshift(newBook);
        
        renderSummary();
        renderList();
        
        modal.close();
        formAdd.reset();
        setRating(3);
        document.getElementById('input-date').valueAsDate = new Date();
      });
    }

    function setRating(val) {
      selectedRating = val;
      starInputs.forEach(star => {
        const v = parseInt(star.dataset.val);
        if (v <= val) {
          star.classList.add('active');
          star.setAttribute('aria-checked', 'true');
        } else {
          star.classList.remove('active');
          star.setAttribute('aria-checked', 'false');
        }
      });
    }

    init();
  </script>
</body>
</html>
